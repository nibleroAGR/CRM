<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichador de Trabajo</title>
    
    <!-- Librerías de la nube (v8 para compatibilidad con tu sintaxis) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --success: #10B981;
            --danger: #EF4444;
            --background: #F3F4F6;
            --card: #FFFFFF;
            --text: #1F2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h2 { margin-top: 0; text-align: center; }

        .hidden { display: none !important; }

        /* Formularios */
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 10px;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background: #9CA3AF; cursor: not-allowed; }

        .btn-primary { background-color: var(--primary); }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        
        .btn-logout {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            margin-top: 20px;
        }

        /* Reloj y Usuario */
        .user-info {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #6B7280;
        }

        .clock-container {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background: #EFF6FF;
            border-radius: 8px;
        }

        #time { font-size: 2.5rem; font-weight: bold; color: var(--primary); }
        #date { font-size: 1rem; color: #4B5563; }

        .file-upload-wrapper {
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        #statusMessage {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="loginView" class="container">
        <h2>Acceso al Fichador</h2>
        <input type="email" id="email" placeholder="Correo electrónico" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button id="btnLogin" class="btn-primary">Iniciar Sesión</button>
        <p id="loginError" style="color: var(--danger); text-align: center; font-size: 0.85rem;"></p>
    </div>

    <!-- PANTALLA PRINCIPAL (DASHBOARD) -->
    <div id="dashboardView" class="container hidden">
        <div class="user-info">
            Conectado como: <strong id="userDisplay"></strong>
        </div>

        <div class="clock-container">
            <div id="time">00:00:00</div>
            <div id="date">Cargando fecha...</div>
        </div>

        <textarea id="comentario" rows="3" placeholder="Añadir comentario (ej. motivo de retraso)..."></textarea>
        
        <div class="file-upload-wrapper">
            <label for="justificante"><strong>Adjuntar justificante (Foto o PDF):</strong></label><br>
            <input type="file" id="justificante" accept="image/*,.pdf" style="margin-top: 5px;">
        </div>

        <button id="btnEntrada" class="btn-success" onclick="registrarFichaje('Entrada')">MARCAR ENTRADA</button>
        <button id="btnSalida" class="btn-danger" onclick="registrarFichaje('Salida')">MARCAR SALIDA</button>
        
        <div id="statusMessage"></div>

        <button id="btnLogout" class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <script>
        // 1. Configuración de tu base de datos
        const firebaseConfig = {
            apiKey: "AIzaSyCqTyb7FvBVRZKAnB_7g8VMvONfI7QKWjE",
            authDomain: "crmv1-21322.firebaseapp.com",
            databaseURL: "https://crmv1-21322-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "crmv1-21322",
            storageBucket: "crmv1-21322.firebasestorage.app",
            messagingSenderId: "892438558015",
            appId: "1:892438558015:web:fccee492b12470628f8f8a",
            measurementId: "G-7BYG21GK2T"
        };

        // Inicializar servicios
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Referencias del DOM
        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const userDisplay = document.getElementById('userDisplay');
        const btnLogin = document.getElementById('btnLogin');
        const loginError = document.getElementById('loginError');
        const statusMessage = document.getElementById('statusMessage');

        // Lógica del Reloj
        function actualizarReloj() {
            const ahora = new Date();
            const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            
            document.getElementById('time').innerText = ahora.toLocaleTimeString('es-ES');
            // Capitalizar la primera letra del día
            let fechaTexto = ahora.toLocaleDateString('es-ES', opcionesFecha);
            document.getElementById('date').innerText = fechaTexto.charAt(0).toUpperCase() + fechaTexto.slice(1);
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        // Gestión de Estado de Autenticación
        auth.onAuthStateChanged(user => {
            if (user) {
                // Usuario conectado
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                userDisplay.innerText = user.email;
            } else {
                // No hay usuario
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
            }
        });

        // Iniciar Sesión
        btnLogin.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            if(!email || !pass) {
                loginError.innerText = "Por favor, rellena todos los campos.";
                return;
            }

            btnLogin.disabled = true;
            btnLogin.innerText = "Iniciando...";

            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    document.getElementById('email').value = '';
                    document.getElementById('password').value = '';
                    loginError.innerText = '';
                })
                .catch(error => {
                    loginError.innerText = "Error: Usuario o contraseña incorrectos.";
                })
                .finally(() => {
                    btnLogin.disabled = false;
                    btnLogin.innerText = "Iniciar Sesión";
                });
        });

        // Cerrar Sesión
        function cerrarSesion() {
            auth.signOut();
        }

        // Lógica para registrar Entrada/Salida
        async function registrarFichaje(tipo) {
            const user = auth.currentUser;
            if (!user) return;

            const btnE = document.getElementById('btnEntrada');
            const btnS = document.getElementById('btnSalida');
            const comentarioInput = document.getElementById('comentario');
            const archivoInput = document.getElementById('justificante');
            const archivo = archivoInput.files[0];

            // Bloquear botones mientras procesa
            btnE.disabled = true;
            btnS.disabled = true;
            statusMessage.style.color = "var(--text)";
            statusMessage.innerText = "Guardando registro en la nube...";

            try {
                let urlArchivo = null;

                // Si hay un archivo, subirlo primero a la nube
                if (archivo) {
                    statusMessage.innerText = "Subiendo justificante...";
                    // Crear un nombre único para el archivo
                    const nombreArchivo = `${Date.now()}_${archivo.name}`;
                    const storageRef = storage.ref(`justificantes/${user.uid}/${nombreArchivo}`);
                    const uploadTask = await storageRef.put(archivo);
                    urlArchivo = await uploadTask.ref.getDownloadURL();
                }

                // Guardar los datos del fichaje
                const nuevoFichaje = {
                    usuarioId: user.uid,
                    email: user.email,
                    tipo: tipo, // 'Entrada' o 'Salida'
                    fechaHora: firebase.firestore.FieldValue.serverTimestamp(),
                    fechaLocal: new Date().toLocaleString('es-ES'),
                    comentario: comentarioInput.value,
                    urlJustificante: urlArchivo
                };

                await db.collection("fichajes").add(nuevoFichaje);

                // Éxito
                statusMessage.style.color = "var(--success)";
                statusMessage.innerText = `¡${tipo} registrada correctamente a las ${new Date().toLocaleTimeString('es-ES')}!`;
                
                // Limpiar campos
                comentarioInput.value = '';
                archivoInput.value = '';

            } catch (error) {
                console.error("Error guardando el registro:", error);
                statusMessage.style.color = "var(--danger)";
                statusMessage.innerText = "Ocurrió un error al guardar. Inténtalo de nuevo.";
            } finally {
                // Desbloquear botones
                btnE.disabled = false;
                btnS.disabled = false;
                
                // Ocultar mensaje después de 5 segundos
                setTimeout(() => {
                    statusMessage.innerText = "";
                }, 5000);
            }
        }
    </script>
</body>
</html>
